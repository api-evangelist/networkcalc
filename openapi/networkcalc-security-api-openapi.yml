openapi: 3.0.3
info:
  title: NetworkCalc Binary Converter Security API
  description: NetworkCalc provides RESTful APIs for network and security tools including a subnet calculator, DNS tools, security tools (TLS/SSL inspection, password generation), encoders, and a binary converter. The public APIs return JSON responses over HTTPS and use common HTTP verbs.
  version: '1.9'
  contact:
    name: NetworkCalc
    url: https://networkcalc.com/
servers:
- url: https://networkcalc.com/api
  description: Production
tags:
- name: Security
  description: TLS/SSL certificate and security utilities.
paths:
  /security/scan/{host}:
    get:
      tags:
      - Security
      summary: SSL/TLS security scan
      description: Inspect SSL/TLS certificate and security configuration for a host.
      parameters:
      - name: host
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Security scan result.
