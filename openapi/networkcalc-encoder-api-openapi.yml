openapi: 3.0.3
info:
  title: NetworkCalc Binary Converter Encoder API
  description: NetworkCalc provides RESTful APIs for network and security tools including a subnet calculator, DNS tools, security tools (TLS/SSL inspection, password generation), encoders, and a binary converter. The public APIs return JSON responses over HTTPS and use common HTTP verbs.
  version: '1.9'
  contact:
    name: NetworkCalc
    url: https://networkcalc.com/
servers:
- url: https://networkcalc.com/api
  description: Production
tags:
- name: Encoder
  description: Encoding and decoding helpers.
paths:
  /encoder/{type}/{value}:
    get:
      tags:
      - Encoder
      summary: Encode or decode a value
      description: Encode or decode a value using the specified encoding type (e.g. base64, url).
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: value
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Encoded or decoded result.
